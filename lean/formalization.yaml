project:
  name: "Certified Exact Minima of Kochen-Specker Sets Inside Coordinate Pools (31/33 in R^3, 18 in R^4, 29 in R^5)"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization and independent SAT/DRUP/LRAT/HOL4-cake_lpr
    certification of exact minimal Kochen-Specker sets inside standard integer coordinate pools:
    31 and 33 rays in R^3 (Conway-Kochen / Peres pools), 18 rays in R^4 (Cabello-Estebaranz-Garcia-Alcaine),
    and 29 rays in R^5 (Cabello-Portillo-Solis-Svozil), with isolated Challenge/Solution Palomar
    comparator targets and strictly standard axioms [propext, Classical.choice, Quot.sound].
  authors:
    - "Alexander Stephen Donahue"
  responsible_maintainers:
    - "Alexander Stephen Donahue"
