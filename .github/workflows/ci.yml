name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly drift & vulnerability check

concurrency:
  group: ks-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyyaml jsonschema
      - name: Run Python unit & integrity tests
        run: python -m unittest discover -s tests -v
      - name: Run doc consistency & RFC 3161 / OpenTimestamps checks
        run: |
          python scripts/check_docs.py
          python scripts/stamp_timestamps.py --verify
      - name: Run Node.js certificate verifier tests
        run: node --test docs/assets/verify.test.mjs
      - name: Build & execute C11 DRUP/QGTL/QRNG engines with ASan/UBSan + independent drat-trim/LRAT + run_all (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -o verify/drup_check verify/drup_check.c
          gcc -O1 -g -std=c11 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -o verify/drup_check_san verify/drup_check.c
          printf "p cnf 2 4\n1 2 0\n1 -2 0\n-1 2 0\n-1 -2 0\n" > /tmp/san_test.cnf
          printf "1 0\n0\n" > /tmp/san_test.drup
          ./verify/drup_check_san /tmp/san_test.cnf /tmp/san_test.drup | grep -q "s VERIFIED"
          gcc -O1 -g -std=gnu11 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ithird_party/qgtl/include -Ithird_party/qgtl/stub \
            third_party/qgtl/src/quantum_geometric/distributed/differential_geometry.c \
            stack/ks31_qgtl.c -lm -o /tmp/ks31_qgtl_san
          /tmp/ks31_qgtl_san results/ks31_box3_H2.json | grep -q "STAGE PASS"
          gcc -O1 -g -std=c11 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            stack/ks31_qrng.c -o /tmp/ks31_qrng_san
          /tmp/ks31_qrng_san | grep -q "\[qrng\] PASS"
          bash scripts/verify_lrat.sh
          python scripts/run_all.py
          bash scripts/audit-repo.sh . --json audit.json --markdown "$GITHUB_STEP_SUMMARY" || true
      - name: Upload Build Standard v1.2.0 audit artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: build-standard-audit
          path: audit.json

  security:
    name: Security scan (SHA-256 verified, report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks v8.30.1 (SHA-256 verified, full history)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json
          echo "gitleaks findings: $(grep -c '"RuleID"' gitleaks.json || true)" >> "$GITHUB_STEP_SUMMARY"
      - name: osv-scanner v2.7.1 (SHA-256 verified, dependency vulnerability check)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --recursive . > osv.txt 2>&1 || true
          { echo '### osv-scanner'; echo '```'; tail -n 40 osv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            gitleaks.json
            osv.txt

  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install elan, Lean 4.35.0 & bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          toolchain="$(tr -d '[:space:]' < lean/lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build zero-Mathlib KS & Solution libraries (zero warnings)
        working-directory: lean
        run: lake build --wfail KS Solution
      - name: Exhaustive axiom audit & Playbook v1.3 H46 forbidden-token check
        working-directory: lean
        shell: bash
        run: |
          set -o pipefail
          lake env lean KS/Audit.lean | tee ../results/lean-audit-ci.log
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          # 1. Verify live axiom audit log strictly within standard axioms (rejecting _native.*, ofReduceBool, sorryAx)
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          log_text = Path("../results/lean-audit-ci.log").read_text(encoding="utf-8")
          unwrapped = re.sub(r",\n\s+", ", ", log_text)
          ax_re = re.compile(r"^'([^']+)' depends on axioms: \[(.*)\]$")
          no_re = re.compile(r"^'([^']+)' does not depend on any axioms$")
          checked = 0
          for raw in unwrapped.splitlines():
              line = raw.strip()
              m = ax_re.match(line)
              if m:
                  checked += 1
                  bad = {a.strip() for a in m.group(2).split(",") if a.strip()} - allowed
                  if bad:
                      print(f"Disallowed axiom in {m.group(1)}: {sorted(bad)}", file=sys.stderr)
                      sys.exit(1)
              elif no_re.match(line):
                  checked += 1
          if checked < 30:
              print(f"Expected >= 30 audited declarations, got {checked}", file=sys.stderr)
              sys.exit(1)
          if "ALL_KS_THEOREMS_AXIOM_AUDIT_PASS:" not in log_text:
              print("Missing ALL_KS_THEOREMS_AXIOM_AUDIT_PASS sentinel in KS/Audit.lean output", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: {checked} explicit KS Lean declarations + exhaustive namespace audit strictly within {sorted(allowed)}.")

          # 2. Nested-comment & string-aware H46 forbidden-token scan
          def strip_lean(src: str) -> str:
              out, i, n, depth, in_str = [], 0, len(src), 0, False
              while i < n:
                  if depth > 0:
                      if src[i:i+2] == "/-": depth += 1; i += 2
                      elif src[i:i+2] == "-/": depth -= 1; i += 2
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  elif in_str:
                      if src[i] == "\\" and i + 1 < n: i += 2
                      elif src[i] == '"': in_str = False; i += 1
                      else:
                          if src[i] == "\n": out.append("\n")
                          i += 1
                  else:
                      if src[i:i+2] == "/-": depth = 1; i += 2
                      elif src[i:i+2] == "--":
                          while i < n and src[i] != "\n": i += 1
                      elif src[i] == '"': in_str = True; i += 1
                      else: out.append(src[i]); i += 1
              return "".join(out)

          forb = re.compile(
              r"\b(sorry|admit|native_decide|unsafe)\b|"
              r"^\s*(?:(?:private|protected|noncomputable|scoped|local)\s+)*axiom\b|"
              r"implemented_by|@\[extern"
          )
          hits = []
          for f in list(Path("KS").rglob("*.lean")) + [Path("KS.lean"), Path("Solution.lean")]:
              for ln, line in enumerate(strip_lean(f.read_text(encoding="utf-8")).splitlines(), 1):
                  if forb.search(line):
                      hits.append(f"{f}:{ln}: {line.strip()}")
          if hits:
              print("Forbidden Lean token found:", hits, file=sys.stderr)
              sys.exit(1)
          print("PASS: 0 forbidden Lean tokens across KS & Solution.")
          PY
      - name: Negative Lean sanity checks (closed decidable facts)
        working-directory: lean
        shell: bash
        run: |
          set +e
          out1=$(lake env lean --stdin 2>&1 <<'LEAN'
          import KS.Spec
          theorem sanity_false_box3_size :
              (KS.boxRays 3 2).length = 48 := by
            decide
          LEAN
          ); rc1=$?
          out2=$(lake env lean --stdin 2>&1 <<'LEAN'
          import KS.Spec
          theorem sanity_false_box4_size :
              (KS.boxRays 4 1).length = 39 := by
            decide
          LEAN
          ); rc2=$?
          out3=$(lake env lean --stdin 2>&1 <<'LEAN'
          import KS.Basic
          theorem sanity_false_card :
              KS.card 49 (2 ^ 30 - 1) = 31 := by
            decide
          LEAN
          ); rc3=$?
          set -e
          for pair in "1:$rc1:$out1" "2:$rc2:$out2" "3:$rc3:$out3"; do
            idx="${pair%%:*}"
            rest="${pair#*:}"
            rc="${rest%%:*}"
            msg="${rest#*:}"
            if [ "$rc" -eq 0 ] || ! printf '%s' "$msg" | grep -q "proved that the proposition"; then
              echo "ERROR: Sanity check $idx did not reject false closed fact (rc=$rc): $msg" >&2
              exit 1
            fi
          done
          echo "PASS: All 3 negative Lean sanity checks (closed decidable facts) were rejected by kernel decide."
      - name: Independent leanchecker --fresh replay (Playbook v1.3 H04)
        working-directory: lean
        run: lake env leanchecker --fresh Solution
      - name: 6-kernel lake comparator --paranoid
        working-directory: lean
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake comparator --config comparator.json --paranoid
      - name: SLSA provenance attestation for Lean audit
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: results/lean-audit-ci.log
