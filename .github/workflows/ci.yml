# Continuous integration for the Kochen-Specker Extremal Lab.
#
# job "checks": the one-command runner scripts/run_all.py (unit tests, JavaScript verifier
#               tests, Lemma 7, regenerated search-tree certificates, CNF + DRUP proofs).
# job "lean":   the Lean 4 development is built from scratch by the Lean kernel, the axioms
#               of the theorems named in lean/KS/Audit.lean are compared with an allowlist,
#               and the sources are scanned for sorry / native_decide.
#
# Third-party actions are pinned to full commit SHAs (the release tag is in the comment).
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash          # bash -eo pipefail: a failing command in a pipe fails the step

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the proof checker
        run: |
          gcc --version | head -n 1
          gcc -O2 -o verify/drup_check verify/drup_check.c

      - name: Run all checks
        run: python scripts/run_all.py

      - name: Show the machine-readable report
        if: always()
        run: |
          if [ -f results/run_all.json ]; then cat results/run_all.json; else echo "no report was written"; fi

  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install elan and the pinned Lean toolchain
        run: |
          toolchain="$(tr -d '[:space:]' < lean/lean-toolchain)"
          echo "toolchain: $toolchain"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Versions
        working-directory: lean
        run: |
          lean --version
          lake --version

      - name: Build (the Lean kernel checks every proof)
        working-directory: lean
        run: lake build        # KS.lean imports Basic, Spec, Box3H2, Box4H1 and Tests

      - name: Axiom audit
        working-directory: lean
        run: |
          lake env lean KS/Audit.lean | tee "$RUNNER_TEMP/audit.txt"
          audit="$RUNNER_TEMP/audit.txt"
          wanted=$(grep -c '^#print axioms' KS/Audit.lean)
          reported=$(tr '\n' ' ' < "$audit" | grep -o -e 'depends on axioms: \[[^]]*\]' -e 'does not depend on any axioms' | wc -l)
          echo "theorems to audit: $wanted, reports: $reported"
          test "$wanted" -ge 1
          test "$reported" -eq "$wanted"
          bad=$(tr '\n' ' ' < "$audit" | grep -o 'depends on axioms: \[[^]]*\]' \
                | sed -e 's/^depends on axioms: \[//' -e 's/\]$//' | tr ',' '\n' \
                | sed -e 's/^ *//' -e 's/ *$//' \
                | grep -v -x -F -e propext -e Classical.choice -e Quot.sound || true)
          if [ -n "$bad" ]; then echo "axioms outside the allowlist:"; echo "$bad"; exit 1; fi
          if grep -q -i 'sorry' "$audit"; then echo "the audit output mentions sorry"; exit 1; fi
          echo "axiom audit OK: only propext, Classical.choice, Quot.sound"

      - name: No sorry / native_decide in the Lean sources
        run: |
          if grep -rnw -e sorry -e native_decide lean/KS lean/KS.lean; then
            echo "sorry or native_decide found in the Lean sources"
            exit 1
          fi
          echo "no sorry / native_decide in lean/KS"
