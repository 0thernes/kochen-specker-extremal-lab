name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Build & test C11 DRUP checker with ASan/UBSan + run_all (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -o verify/drup_check verify/drup_check.c
          gcc -O1 -g -std=c11 -Wall -Wextra -fsanitize=address,undefined -o verify/drup_check_san verify/drup_check.c
          python scripts/run_all.py
          bash scripts/audit-repo.sh .
      - name: Secret scan (gitleaks, report-only)
        if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan, Lean 4.35.0 & bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          toolchain="$(tr -d '[:space:]' < lean/lean-toolchain)"
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build zero-Mathlib KS & Solution libraries
        working-directory: lean
        run: lake build KS Solution
      - name: Exhaustive axiom audit & forbidden-token check
        working-directory: lean
        run: |
          lake env lean KS/Audit.lean | tee ../results/lean-audit-ci.log
          if grep -rnE '\b(sorry|admit|native_decide)\b|^\s*axiom\b' KS KS.lean Solution.lean | grep -vE '^[^:]+:[0-9]+:\s*(--|/-)'; then
            echo "Forbidden Lean token found!" >&2
            exit 1
          fi
      - name: 6-kernel lake comparator --paranoid
        working-directory: lean
        run: lake comparator --config comparator.json --paranoid
      - name: SLSA provenance attestation for Lean audit
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: results/lean-audit-ci.log
